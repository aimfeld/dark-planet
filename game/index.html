<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Dark Planet</title>
    <meta name="apple-mobile-web-app-title" content="Dark Planet" />
    <link rel="icon" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Link preview card. Crawlers need absolute URLs. The image is screenshots/remastered/l1-navi-4.png
         cropped to 0,150–1920,1158 and scaled to 1200x630. -->
    <meta name="description" content="Dark Planet (1998), a vertical-scrolling DOS shoot 'em up, remastered for the browser. Play it on desktop, phone or tablet." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aimfeld.github.io/dark-planet/" />
    <meta property="og:site_name" content="Dark Planet" />
    <meta property="og:title" content="Dark Planet Remastered" />
    <meta property="og:description" content="A vertical-scrolling DOS shoot 'em up from 1998, remastered for the browser. Play it on desktop, phone or tablet." />
    <meta property="og:image" content="https://aimfeld.github.io/dark-planet/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dark Planet Remastered, level 1: a jet with missile pods firing over water and sand, next to a large explosion" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #app { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      #status { position: fixed; left: 8px; bottom: 6px; color: #888; font: 12px monospace; }
      #keys { position: fixed; left: 0; right: 0; padding: 6px 8px; color: #888; font: 12px/1.5 monospace;
        text-align: center; white-space: pre-line;
        min-height: 3em; } /* two lines, so the picture keeps its size when the video's one line ends */
      #keys[hidden] { display: none; }
      #remaster { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); padding: 4px 10px;
        background: rgba(0, 0, 0, 0.7); color: #ddd; font: 14px monospace; pointer-events: none; }
      #remaster[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status"></div>
    <div id="keys" hidden></div>
    <div id="remaster" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
