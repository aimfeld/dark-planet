<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Dark Planet</title>
    <meta name="apple-mobile-web-app-title" content="Dark Planet" />
    <link rel="icon" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #app { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      #status { position: fixed; left: 8px; bottom: 6px; color: #888; font: 12px monospace; }
      #keys { position: fixed; left: 0; right: 0; padding: 6px 8px; color: #888; font: 12px/1.5 monospace;
        text-align: center; white-space: pre-line;
        min-height: 3em; } /* two lines, so the picture keeps its size when the video's one line ends */
      #keys[hidden] { display: none; }
      #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #aaa; font: 16px monospace; cursor: pointer; }
      #start[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status"></div>
    <div id="keys" hidden></div>
    <div id="start" hidden>Dark Planet: Taste oder Klick zum Starten</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
